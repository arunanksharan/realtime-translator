[tool.poetry]
name = "realtime-translator"
version = "0.1.0"
description = "Real-time bidirectional language translator"
authors = ["Kuzushi Labs <arunank@kuzushilabs.xyz>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.12,<0.116.0"
uvicorn = {extras = ["standard"], version = ">=0.34.3,<0.35.0"}
pydantic = {version = ">=2.10.6,<2.11.0", extras = ["email"]}
pydantic-settings = ">=2.1.0,<2.2.0"
sqlalchemy = "^2.0.23"
alembic = ">=1.16.1,<2.0.0"
asyncpg = "^0.29.0"
redis = ">=6.2.0,<7.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
httpx = "^0.28.1"
python-dotenv = "^1.0.0"
loguru = "^0.7.2"
prometheus-client = "^0.19.0"
opentelemetry-api = "^1.34.1"
opentelemetry-sdk = "^1.34.1"
opentelemetry-distro = "^0.55b1"
opentelemetry-instrumentation = "^0.55b1"
greenlet = "^3.2.3"
psycopg2-binary = ">=2.9.10,<3.0.0"
onnxruntime = ">=1.20.1,<1.21.0"

# Pipecat and AI dependencies
# pipecat-ai = "^0.0.40"
pipecat-ai = { version = "0.0.74", extras = [
  "daily", "deepgram", "elevenlabs", "openai",
  "noisereduce", "gladia", "remote-smart-turn", "google"
] }
google-genai = ">=1.24.0,<1.25.0"
google-cloud-aiplatform = "^1.38.1"
# daily-python = "^0.10.1"

# Audio processing
numpy = "^1.26.2"
scipy = "^1.11.4"
librosa = "^0.10.1"
soundfile = "^0.12.1"
webrtcvad = "^2.0.10"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.1"
pre-commit = "^3.6.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=html --cov-report=term-missing"
